name: Python Versions Sync

# Keeps the Python versions declared in pyproject.toml in step with the
# versions upstream still supports, using endoflife.date as the source.
#
# When the declaration differs from the active set, this opens a PR from a
# new branch as github-actions[bot]. A PR opened with GITHUB_TOKEN does not
# trigger further workflow runs; close and reopen it to run the full checks.
#
# Requires: Settings > Actions > General > "Allow GitHub Actions to create
# and approve pull requests" enabled.

on:
  schedule:
    - cron: "0 3 * * 1"  # Mondays at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Python versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch supported Python versions
        id: fetch-versions
        run: |
          # pipefail so a curl failure isn't masked by jq emitting [].
          set -euo pipefail

          versions=$(curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 \
                       https://endoflife.date/api/v1/products/python/ \
                     | jq -c '[ .result.releases[] | select(.isEol == false) | .label ]')

          if [ "$(echo "$versions" | jq 'length')" -eq 0 ]; then
            echo "::error::endoflife.date returned no supported Python versions"
            exit 1
          fi

          echo "active=$versions" >> "$GITHUB_OUTPUT"
          echo "Active Python versions: $versions"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Apply to pyproject.toml
        id: update
        env:
          ACTIVE_VERSIONS: ${{ steps.fetch-versions.outputs.active }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: |
          set -euo pipefail
          pip install --quiet tomlkit
          python .github/scripts/sync_python_versions.py

      - name: Open pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: chore/python-versions-sync
          branch-suffix: timestamp
          add-paths: pyproject.toml
          commit-message: "chore: sync Python versions in pyproject.toml"
          title: "chore: sync Python versions in pyproject.toml"
          body-path: ${{ runner.temp }}/pr-body.md
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
